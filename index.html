      ov.remove(); res({ nick, avatar: av });
    });
  });
}

Views.account = (root) => {
  setTop({ back: 'home', title: T('내 계정', 'My account') });
  const draw = () => {
    if (!Cloud.available) {
      root.innerHTML = `<div class="scroll"><div class="wrap"><div class="hero">${Art.lion('think')}<div class="bubble">${rich(T('온라인 기능은 설치한 <b>하루체스 앱</b>에서만 쓸 수 있어요. 지금 화면에서는 혼자 연습할 수 있어요.', 'Online features work only in the installed <b>Daily Chess</b> app. You can still practice here.'))}</div></div></div></div>`;
      return;
    }
    if (!Net.ready) { root.innerHTML = `<div class="scroll"><div class="wrap"><p style="text-align:center;margin-top:40px">${tx(T('잠깐만요…', 'One moment…'))}</p></div></div>`; return; }
    if (!Net.user) {
      root.innerHTML = `<div class="scroll"><div class="wrap"><div class="hero">${Art.lion('wink')}<div class="bubble">${rich(T('친구와 진도를 나누고 온라인으로 대국하려면 <b>부모님 계정</b>으로 로그인해요.', 'To share progress and play online, a <b>parent signs in</b>.'))}</div></div>
        <div class="card"><h3>${ic('lock', 20)} ${tx(T('안전하게 쓰는 법', 'Staying safe'), true)}</h3><ul style="margin:0;padding-left:20px;font-size:.95rem"><li>${rich(T('아이의 <b>이름·나이·이메일은 저장하지 않아요.</b> 별명과 그림만 써요.', 'We <b>do not store a child\'s name, age or email.</b> Only a nickname and a picture.'))}</li><li>${rich(T('<b>채팅은 없어요.</b> 정해진 인사 말풍선만 보낼 수 있어요.', '<b>There is no chat.</b> Only set greeting bubbles.'))}</li><li>${rich(T('친구는 <b>코드를 아는 사람</b>만 되고, 부모님 확인이 있어야 수락돼요.', 'Friends are only people who know your <b>code</b>, and a parent confirms each request.'))}</li></ul></div>
        <div class="card"><h3>${tx(T('이메일로 로그인', 'Sign in with email'), true)}</h3>
          <input class="input" id="a-em" type="email" autocomplete="username" autocapitalize="off" placeholder="${shortL(T('부모님 이메일', 'Parent email'))}">
          <input class="input" id="a-pw" type="password" autocomplete="current-password" placeholder="${shortL(T('비밀번호 (6자 이상)', 'Password (6+ chars)'))}" style="margin-top:8px">
          <div class="msg" id="a-msg" style="min-height:1.3em;color:var(--bad);margin:6px 0"></div>
          <div class="row center"><button class="btn mint" id="a-login">${tx(T('로그인', 'Sign in'))}</button><button class="btn lav" id="a-new">${tx(T('새로 가입', 'Create account'))}</button></div>
          <div class="row center" style="margin-top:8px"><button class="btn ghost sm" id="a-forgot">${tx(T('비밀번호를 잊었어요', 'Forgot password'))}</button></div></div>
        ${Cloud.standalone && Cloud.standalone() ? '' : `<div class="row center" style="margin-top:14px"><button class="btn tile-go" id="a-in" style="min-width:240px;min-height:60px">${tx(T('Google로 로그인', 'Sign in with Google'), true)}</button></div>`}</div></div>`;
      const msg = (t) => { $('#a-msg', root).innerHTML = t ? tx(t) : ''; };
      const creds = () => { const em = $('#a-em', root).value.trim(), pw = $('#a-pw', root).value; if (!em || !pw) { msg(T('이메일과 비밀번호를 입력해 주세요.', 'Enter email and password.')); return null; } return { em, pw }; };
      const doEmail = async (create) => { const c = creds(); if (!c) return; msg(''); try { await Cloud.emailAuth(c.em, c.pw, create); } catch (e) { msg(errText(e)); } };
      $('#a-login', root).onclick = () => { sfx('tap'); doEmail(false); };
      $('#a-new', root).onclick = () => { sfx('tap'); doEmail(true); };
      $('#a-forgot', root).onclick = async () => { const em = $('#a-em', root).value.trim(); if (!em) { msg(T('이메일을 먼저 적어 주세요.', 'Enter your email first.')); return; } try { await Cloud.resetPw(em); toast(T('비밀번호 재설정 메일을 보냈어요.', 'Password reset email sent.'), 3500); } catch (e) { msg(errText(e)); } };
      if ($('#a-in', root)) $('#a-in', root).onclick = async () => { sfx('tap'); try { await Cloud.signIn(); } catch (e) { toast(T('로그인이 안 됐어요. 다시 해 주세요.', 'Sign-in did not work. Please try again.')); } };
      return;
    }
    const cur = S.cloud.pid;
    root.innerHTML = `<div class="scroll"><div class="wrap">
      <div class="card"><h3>${tx(T('부모님 계정', 'Parent account'), true)}</h3><p style="margin:0 0 10px;font-size:.95rem;color:var(--ink2)">${esc(Net.user.name || '')} · ${tx(T('로그인됨', 'Signed in'))}</p><button class="btn pink sm" id="a-out">${tx(T('로그아웃', 'Sign out'))}</button></div>
      <div class="sec">${tx(T('우리 아이 프로필', 'Kid profiles'), true)}</div>
      <div class="profs">${Net.profs.map((p) => `<div class="card prof ${p.id === cur ? 'cur' : ''}">${avHtml(p.avatar, 56)}<div class="grow"><b style="font-family:var(--font-d);font-weight:400;font-size:1.1rem">${esc(p.nick)}</b><div style="font-size:.85rem;color:var(--ink2)">★ ${p.stars || 0} · ${tx(T('코드', 'Code'))} ${fmtCode(esc(p.code))}</div></div>
        ${p.id === cur ? `<span class="pill warn">${tx(T('사용 중', 'In use'))}</span>` : `<button class="btn mint sm" data-sel="${p.id}">${tx(T('선택', 'Use'))}</button>`}<button class="btn ghost sm" data-ed="${p.id}">${tx(T('고치기', 'Edit'))}</button></div>`).join('')}</div>
      ${Net.profs.length < 6 ? `<div class="row center" style="margin-top:12px"><button class="btn lav" id="a-add">＋ ${tx(T('프로필 추가', 'Add profile'), true)}</button></div>` : ''}
      ${Net.profs.length ? `<div class="row center" style="margin-top:14px"><button class="btn tile-go" id="a-go">${tx(T('친구·온라인으로', 'Go to Friends & Online'), true)}</button></div>` : `<p style="text-align:center;color:var(--ink2)">${tx(T('먼저 프로필을 만들어 주세요.', 'Please create a profile first.'))}</p>`}
    </div></div>`;
  };
  draw();
  const refresh = () => { if (V.name === 'account') draw(); };
  Net.ui.add(refresh); V.cleanup = () => Net.ui.delete(refresh);
  root.addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return; sfx('tap');
    try {
      if (t.id === 'a-out') { if (!(await verifyParent())) return; await Cloud.signOut(); }
      else if (t.id === 'a-add') {
        if (!(await verifyParent())) return;
        const r = await profileForm(null); if (!r) return;
        const id = await Net.createProfile(r.nick, r.avatar);
        await Net.select(id); toast(T('프로필을 만들었어요!', 'Profile created!'));
      } else if (t.dataset.sel) { await Net.select(t.dataset.sel); toast(T('프로필을 바꿨어요', 'Profile changed')); }
      else if (t.dataset.ed) {
        if (!(await verifyParent())) return;
        const p = Net.profs.find((x) => x.id === t.dataset.ed);
        const k = await ask({ lion: 'think', title: esc(p.nick), buttons: [{ k: 'edit', label: T('별명·그림 고치기', 'Edit nickname & picture'), cls: 'lav' }, { k: 'del', label: T('프로필 지우기', 'Delete profile'), cls: 'pink' }, { k: 'x', label: T('닫기', 'Close'), cls: 'ghost' }], top: true });
        if (k === 'edit') { const r = await profileForm(p); if (r) await Net.editProfile(p, r.nick, r.avatar); }
        else if (k === 'del') {
          const y = await ask({ lion: 'oops', title: T('정말 지울까요?', 'Delete it?'), text: T('이 프로필의 별과 친구 목록이 사라져요.', 'Its stars and friends will be removed.'), buttons: [{ k: 'y', label: T('지우기', 'Delete'), cls: 'pink' }, { k: 'n', label: T('아니요', 'No'), cls: 'ghost' }], top: true });
          if (y === 'y') await Net.deleteProfile(p);
        }
      } else if (t.id === 'a-go') go('online');
    } catch (err) { toast(errText(err), 3500); }
  });
};

Views.online = (root) => {
  if (!Cloud.available || !Net.user || !Net.me()) { go('account'); return; }
  setTop({ back: 'home', title: T('친구·온라인', 'Friends & Online'), right: `<button class="btn ghost sm" id="tb-acc">${tx(T('계정', 'Account'))}</button>` });
  $('#tb-acc').onclick = () => go('account');
  let unwatchF = () => {}; let watchKey = ''; let waiting = null;
  const myColorIn = (g, pid) => (g.white.pid === pid ? 0 : 1);
  const draw = () => {
    const me = Net.me(); if (!me) { go('account'); return; }
    const keep = $('.scroll', root) ? $('.scroll', root).scrollTop : 0;
    const frs = Net.friendsOf(me.id);
    const ins = Net.incoming(me.id), outs = Net.outgoing(me.id);
    const gs = Net.myGames(me.id);
    const invIn = gs.filter((g) => g.status === 'invite' && g.from !== myColorIn(g, me.id));
    const invOut = gs.filter((g) => g.status === 'invite' && g.from === myColorIn(g, me.id));
    const act = gs.filter((g) => g.status === 'active');
    const oppOf = (g) => (g.white.pid === me.id ? g.black : g.white);
    const turnOf = (g) => ((g.moves.length % 2 === 0 ? 0 : 1) === myColorIn(g, me.id) ? T('내 차례', 'Your turn') : T('친구 차례', 'Their turn'));
    const key = frs.map((f) => f.pid).join(',');
    if (key !== watchKey) { unwatchF(); watchKey = key; unwatchF = Net.watchProfiles(frs.map((f) => f.pid), () => { if (V.name === 'online') draw(); }); }
    const net = (S.stats.net || { w: 0, l: 0, d: 0 });
    root.innerHTML = `<div class="scroll"><div class="wrap">
      <div class="card prof cur">${avHtml(me.avatar, 60)}<div class="grow"><b style="font-family:var(--font-d);font-weight:400;font-size:1.2rem">${esc(me.nick)}</b><div style="font-size:.85rem;color:var(--ink2)">★ ${Object.values(S.progress).reduce((a, c) => a + ((c || {}).stars || 0), 0)} · ${tx(T(`온라인 ${net.w}승 ${net.l}패 ${net.d}무`, `Online ${net.w}W ${net.l}L ${net.d}D`))}</div></div></div>
      <div class="card" style="margin-top:12px"><h3>${tx(T('내 친구 코드', 'My friend code'), true)}</h3><div class="codebox"><span id="mycode">${fmtCode(esc(me.code))}</span><button class="btn ghost sm" id="o-copy">${ic('copy', 18)} ${tx(T('복사', 'Copy'))}</button></div>
        <p style="margin:8px 0 0;font-size:.88rem;color:var(--ink2)">${tx(T('친구에게 이 코드를 알려 주세요. 부모님과 함께 확인해요.', 'Share this code with a friend. Check it with a parent.'))}</p></div>
      <div class="card" style="margin-top:12px"><h3>${tx(T('친구 추가', 'Add a friend'), true)}</h3><div class="row"><input class="input grow" id="o-code" placeholder="${shortL(T('친구 코드 입력', 'Friend code'))}" maxlength="12" autocapitalize="characters" autocomplete="off" style="text-align:left"><button class="btn mint" id="o-add">${tx(T('요청', 'Send'))}</button></div>
        ${outs.length ? `<p style="margin:8px 0 0;font-size:.88rem;color:var(--ink2)">${tx(T('수락을 기다리는 중: ', 'Waiting for: '))}${outs.map((o) => esc(o.toNick)).join(', ')}</p>` : ''}</div>
      ${(ins.length || invIn.length) ? `<div class="sec">${tx(T('도착한 알림', 'Notifications'), true)}</div>` : ''}
      ${ins.map((f) => `<div class="card prof">${avHtml(f.fromAvatar, 48)}<div class="grow"><b>${esc(f.fromNick)}</b><div style="font-size:.85rem;color:var(--ink2)">${tx(T('친구 요청', 'Friend request'))}</div></div><button class="btn mint sm" data-facc="${f.id}">${tx(T('수락', 'Accept'))}</button><button class="btn ghost sm" data-fno="${f.id}">${tx(T('거절', 'Decline'))}</button></div>`).join('')}
      ${invIn.map((g) => { const o = oppOf(g); return `<div class="card prof">${avHtml(o.avatar, 48)}<div class="grow"><b>${esc(o.nick)}</b><div style="font-size:.85rem;color:var(--ink2)">${tx(T('대국 도전장', 'Challenge'))} · ${g.clock ? `${g.clock.min}+${g.clock.inc}` : tx(T('시계 없음', 'No clock'))} · ${tx(myColorIn(g, me.id) === 0 ? T('흰색', 'White') : T('검은색', 'Black'))}</div></div><button class="btn mint sm" data-gacc="${g.id}">${tx(T('받기', 'Play'))}</button><button class="btn ghost sm" data-gno="${g.id}">${tx(T('거절', 'No'))}</button></div>`; }).join('')}
      ${(act.length || invOut.length) ? `<div class="sec">${tx(T('진행 중인 대국', 'Games in progress'), true)}</div>` : ''}
      ${act.map((g) => { const o = oppOf(g); return `<div class="card prof">${avHtml(o.avatar, 48)}<div class="grow"><b>${esc(o.nick)}</b><div style="font-size:.85rem;color:var(--ink2)">${tx(turnOf(g))} · ${tx(T(`${g.moves.length}수`, `${g.moves.length} moves`))}</div></div><button class="btn sm" data-gopen="${g.id}">${ic('play', 18)} ${tx(T('이어하기', 'Continue'))}</button></div>`; }).join('')}
      ${invOut.map((g) => { const o = oppOf(g); return `<div class="card prof">${avHtml(o.avatar, 48)}<div class="grow"><b>${esc(o.nick)}</b><div style="font-size:.85rem;color:var(--ink2)">${tx(T('도전장을 보냈어요. 기다리는 중…', 'Challenge sent. Waiting…'))}</div></div><button class="btn ghost sm" data-gcan="${g.id}">${tx(T('취소', 'Cancel'))}</button></div>`; }).join('')}
      <div class="sec">${tx(T('내 친구들', 'My friends'), true)}</div>
      ${frs.length ? frs.map((f) => { const d = Net.fprof[f.pid]; return `<div class="card prof">${avHtml(f.avatar, 52)}<div class="grow"><b style="font-family:var(--font-d);font-weight:400;font-size:1.05rem">${esc(f.nick)}</b><div style="font-size:.85rem;color:var(--ink2)">${d ? `★ ${d.stars || 0} · ${tx(T(`${d.done || 0}단원`, `${d.done || 0} chapters`))} · ${tx(ago(d.lastActive))}` : '…'}</div></div><button class="btn sm" data-fch="${f.pid}">${tx(T('도전', 'Challenge'))}</button><button class="btn ghost sm" data-finfo="${f.pid}">${tx(T('정보', 'Info'))}</button></div>`; }).join('') : `<div class="bubble" style="margin:0">${rich(T('아직 친구가 없어요. 친구 코드를 입력해서 첫 친구를 만들어 봐요!', 'No friends yet. Enter a friend\'s code to make your first friend!'))}</div>`}
    </div></div>`;
    $('.scroll', root).scrollTop = keep;
    // challenger auto-enters the game when the friend accepts
    if (waiting) { const g = gs.find((x) => x.id === waiting); if (g && g.status === 'active') { const id = waiting; waiting = null; go('game', { net: id }); } }
  };
  draw();
  const refresh = () => { if (V.name === 'online') draw(); };
  Net.ui.add(refresh);
  V.cleanup = () => { Net.ui.delete(refresh); unwatchF(); };
  root.addEventListener('click', async (e) => {
    const t = e.target.closest('button'); if (!t) return; sfx('tap');
    const me = Net.me(); if (!me) return;
    try {
      if (t.id === 'o-copy') { try { await navigator.clipboard.writeText(me.code); toast(T('코드를 복사했어요', 'Code copied')); } catch (er) { toast(T('코드: ', 'Code: ') + me.code, 4000); } }
      else if (t.id === 'o-add') {
        const v = $('#o-code', root).value; if (!v.trim()) return;
        if (!(await verifyParent(T('친구를 추가하려면 필요해요', 'Needed to add a friend')))) return;
        const c = await Net.requestFriend(v); $('#o-code', root).value = '';
        toast(T(`${esc(c.nick)}님에게 요청을 보냈어요`, `Request sent to ${esc(c.nick)}`), 3500);
      } else if (t.dataset.facc) {
        if (!(await verifyParent(T('친구 수락에는 부모님 확인이 필요해요', 'A parent must confirm new friends')))) return;
        const f = Net.fs.find((x) => x.id === t.dataset.facc); await Net.acceptFriend(f); toast(T('친구가 되었어요!', 'You are friends now!'));
      } else if (t.dataset.fno) { if (!(await verifyParent())) return; await Net.removeFriend(t.dataset.fno); }
      else if (t.dataset.gacc) {
        const g = Net.games.find((x) => x.id === t.dataset.gacc); await Net.acceptGame(g); go('game', { net: g.id });
      } else if (t.dataset.gno) { await Net.cancelGame(Net.games.find((x) => x.id === t.dataset.gno)); }
      else if (t.dataset.gcan) { await Net.cancelGame(Net.games.find((x) => x.id === t.dataset.gcan)); if (waiting === t.dataset.gcan) waiting = null; }
      else if (t.dataset.gopen) go('game', { net: t.dataset.gopen });
      else if (t.dataset.finfo) friendInfo(Net.friendsOf(me.id).find((f) => f.pid === t.dataset.finfo));
      else if (t.dataset.fch) {
        const fr = Net.friendsOf(me.id).find((f) => f.pid === t.dataset.fch);
        const r = await challengeDialog(fr); if (!r) return;
        const id = await Net.challenge(fr, r.color, r.clock); waiting = id;
        toast(T('도전장을 보냈어요! 친구가 받으면 시작돼요.', 'Challenge sent! It starts when your friend accepts.'), 3500);
      }
    } catch (err) { toast(errText(err), 3500); }
  });
};

async function challengeDialog(fr) {
  let color = 'r', clk = S.setup.clock === 'custom' ? '10+5' : S.setup.clock;
  return new Promise((res) => {
    const ov = openModal('', { dismiss: false, top: true });
    const draw = () => {
      $('.modal', ov).innerHTML = `${avHtml(fr.avatar, 64)}<h2>${tx(T(`${esc(fr.nick)}에게 도전!`, `Challenge ${esc(fr.nick)}!`))}</h2>
        <div class="field">${tx(T('내 색깔', 'My color'), true)}</div><div class="chips" style="justify-content:center">${[['w', T('흰색', 'White')], ['b', T('검은색', 'Black')], ['r', T('아무거나', 'Random')]].map(([k, l]) => `<button class="chip" data-c="${k}" aria-pressed="${color === k}">${tx(l)}</button>`).join('')}</div>
        <div class="field">${tx(T('시계', 'Clock'), true)}</div><div class="chips" style="justify-content:center">${CLOCKS.filter((c) => c.id !== 'custom').map((c) => `<button class="chip" data-t="${c.id}" aria-pressed="${clk === c.id}">${tx(c.label)}</button>`).join('')}</div>
        <div class="row" style="margin-top:16px"><button class="btn ghost sm" data-k="c">${tx(T('취소', 'Cancel'))}</button><button class="btn" data-k="o">${tx(T('도전장 보내기', 'Send challenge'))}</button></div>`;
    };
    draw();
    ov.addEventListener('click', (e) => {
      const c = e.target.closest('[data-c]'); if (c) { color = c.dataset.c; draw(); return; }
      const t = e.target.closest('[data-t]'); if (t) { clk = t.dataset.t; draw(); return; }
      const b = e.target.closest('button[data-k]'); if (!b) return;
      ov.remove();
      if (b.dataset.k === 'c') { res(null); return; }
      const cc = CLOCKS.find((x) => x.id === clk);
      res({ color, clock: cc && cc.min ? { min: cc.min, inc: cc.inc } : null });
    });
  });
}

async function friendInfo(f) {
  if (!f) return;
  const d = Net.fprof[f.pid] || {};
  const done = d.done || 0, total = Content.basic.length + Content.pro.length;
  const n = (d.stats && d.stats.net) || { w: 0, l: 0, d: 0 };
  const cpuWins = d.stats ? Object.values(d.stats.wins || {}).reduce((a, b) => a + b, 0) : 0;
  const k = await ask({
    html: `${avHtml(f.avatar, 72)}<h2 style="margin-top:6px">${esc(f.nick)}</h2>
      <div class="infogrid"><div><b>★ ${d.stars || 0}</b><span>${tx(T('모은 별', 'Stars'))}</span></div><div><b>${done}/${total}</b><span>${tx(T('끝낸 단원', 'Chapters'))}</span></div><div><b>${(d.streak && d.streak.n) || 0}</b><span>${tx(T('연속 일', 'Day streak'))}</span></div><div><b>${(d.stats && d.stats.games) || 0}</b><span>${tx(T('한 대국', 'Games'))}</span></div><div><b>${cpuWins}</b><span>${tx(T('레오를 이김', 'Wins vs Leo'))}</span></div><div><b>${n.w}-${n.l}-${n.d}</b><span>${tx(T('온라인 승-패-무', 'Online W-L-D'))}</span></div></div>
      <p style="font-size:.88rem;color:var(--ink2)">${tx(T('마지막 접속: ', 'Last seen: '))}${tx(ago(d.lastActive))}</p>`,
    buttons: [{ k: 'x', label: T('닫기', 'Close'), cls: 'mint' }, { k: 'rm', label: T('친구 끊기', 'Remove friend'), cls: 'ghost' }], top: true,
  });
  if (k === 'rm') {
    if (!(await verifyParent())) return;
    try { await Net.removeFriend(f.fid); toast(T('친구를 끊었어요', 'Friend removed')); } catch (e) { toast(errText(e)); }
  }
}

</script>
<script>
/* Screens: home, learn map, guide, settings, parent area, play setup. */
'use strict';
const LEVEL_DESC = [null,
  T('처음 해 보는 친구', 'For brand-new players'), T('규칙을 배우는 중', 'Learning the rules'), T('조금 익숙해졌어요', 'Getting comfortable'),
  T('도전해 볼래요', 'Ready for a challenge'), T('고수 도전!', 'Expert challenge'), T('최강 단계', 'The strongest level')];
const LEVEL_MOOD = [null, 'happy', 'happy', 'wink', 'think', 'think', 'oops'];
const CLOCKS = [
  { id: 'off', label: T('끔', 'Off'), tag: T('시계 없이 편하게', 'No pressure') },
  { id: '15+10', min: 15, inc: 10, label: T('15분+10초', '15+10'), tag: T('배우는 중 추천', 'Great for learning') },

}

      <div style="margin-top:8px;font-size:.92rem;color:var(--ink2)">${tx(cl ? cl.tag : T('', ''))}${cfg ? ` · ${tx(T(`한 사람당 ${cfg.min}분, 한 수마다 +${cfg.inc}초`, `${cfg.min} min each, +${cfg.inc} sec per move`))}` : ''}</div>
      ${su.clock === 'custom' ? `<div class="row" style="margin-top:10px;gap:18px"><div class="stepper"><button class="btn ghost icon" data-st="min-" aria-label="minus">−</button><b>${su.custom.min}${tx(T('분', 'm'), true)}</b><button class="btn ghost icon" data-st="min+" aria-label="plus">＋</button></div><div class="stepper"><button class="btn ghost icon" data-st="inc-" aria-label="minus">−</button><b>+${su.custom.inc}${tx(T('초', 's'), true)}</b><button class="btn ghost icon" data-st="inc+" aria-label="plus">＋</button></div></div>` : ''}
      <div class="field">${tx(T('도우미', 'Helpers'), true)}</div><div class="card" style="padding:4px 14px">
        ${sw('s-hint', T('훈수 (이유까지 알려줘요)', 'Hints (with the reasons)'), null, su.hint)}
        ${sw('s-safety', T('안전 확인 (말을 잃을 수 있으면 물어봐요)', 'Safety check (asks before you lose a piece)'), null, su.safety)}
        ${sw('s-undo', T('무르기 허용', 'Allow take-backs'), null, su.undo)}
        ${cpu ? '' : sw('s-f2f', T('마주 보기 (상대 쪽에서도 잘 보여요)', 'Face to face (readable from both sides)'), T('아이패드를 가운데 놓고 둘이 마주 앉아요', 'Place the tablet between you'), su.f2f)}
      </div>
      <div class="row center" style="margin-top:18px"><button class="btn tile-go" id="s-go" style="min-width:220px;min-height:62px;font-size:1.3rem">${ic('play', 22)} ${tx(T('시작!', 'Start!'), true)}</button></div>
    </div></div>`;
    $('.scroll', root).scrollTop = keep;
  };
  draw();
  root.addEventListener('click', (e) => {
    const c = e.target.closest('.chip[data-set]');
    if (c) { sfx('tap'); const k = c.dataset.set; su[k] = k === 'level' ? +c.dataset.v : c.dataset.v; save(); draw(); return; }
    const st = e.target.closest('[data-st]');
    if (st) { sfx('tap'); const k = st.dataset.st; const cu = su.custom;
      if (k === 'min-') cu.min = Math.max(1, cu.min - (cu.min > 10 ? 5 : 1)); if (k === 'min+') cu.min = Math.min(90, cu.min + (cu.min >= 10 ? 5 : 1));
      if (k === 'inc-') cu.inc = Math.max(0, cu.inc - 1); if (k === 'inc+') cu.inc = Math.min(30, cu.inc + 1);
      save(); draw(); return; }
    const tg = e.target.closest('.tg');
    if (tg) { sfx('tap'); const m = { 's-hint': 'hint', 's-safety': 'safety', 's-undo': 'undo', 's-f2f': 'f2f' }[tg.id]; su[m] = !su[m]; save(); tg.setAttribute('aria-checked', su[m]); return; }
    if (e.target.closest('#s-go')) { sfx('tap'); save(); go('game', { fresh: true }); }
  });
};

<script>
/* Lesson runner: say / tap / move / mate / seq / quiz steps. */
'use strict';
function okMatch(ok, g, m) {
  if (ok === 'any') return true;
  if (Array.isArray(ok)) return ok.includes(g.uci(m));
  if (ok.piece) return PTYPE[(m.p & 7) - 1] === ok.piece;
  if (ok.to) return ok.to.includes(sqName(m.t));
  if (ok.from) return ok.from.includes(sqName(m.f));
  return false;
}
// does playing m force checkmate within n of my own moves?
function leadsToMate(g, m, n) {
  g.make(m);
  let ok;
  const rep = g.legal();
  if (!rep.length) ok = g.inCheck();
  else if (n <= 1) ok = false;
  else ok = rep.every((r) => { g.make(r); const x = g.forcedMate(n - 1); g.unmake(); return x; });
  g.unmake();
  return ok;
}

Views.lesson = (root, params) => {
  const all = Content.basic.concat(Content.pro);
  const ch = all.find((c) => c.id === params.ch);
  if (!ch) { go('learn'); return; }
  const L = { i: 0, mistakes: 0, dead: false, tok: 0, g: null, step: null, accept: false, items: null, k: 0, tapOn: false, mateN: 1, seqI: 0, done: false };
  V.cleanup = () => { L.dead = true; L.tok++; };
  const dotsHtml = () => ch.steps.map((_, i) => `<i class="${i < L.i ? 'on' : i === L.i ? 'cur' : ''}"></i>`).join('');
  setTop({ back: 'learn', title: ch.title, right: '<div class="dots" id="dots"></div>' });
  root.innerHTML = '<div class="lesson"><div class="boardwrap" id="bw"></div><div class="coach"><div id="lion"></div><div class="bubble"><div id="txt"></div><div class="acts" id="acts"></div></div></div></div>';
  const board = new Board();
  $('#bw', root).appendChild(board.el);
  const lionEl = $('#lion', root), txt = $('#txt', root), acts = $('#acts', root);
  const say = (o, mood, extra) => { lionEl.innerHTML = Art.lion(mood || 'happy'); txt.innerHTML = rich(o) + (extra || ''); };
  const B = (a, label, cls) => `<button class="btn sm ${cls || ''}" data-a="${a}">${label}</button>`;
  const speakBtn = () => B('speak', ic('speaker', 18), 'ghost');
  const hintBtn = () => B('hint', ic('bulb', 18) + ' ' + tx(T('힌트', 'Hint'), true), 'lav');
  const last = () => L.i === ch.steps.length - 1;
  const nextBtn = () => {
    const s = L.step;
    if (last() && s && s.goto === 'play') return B('play', ic('play', 18) + ' ' + tx(T('대국하러 가기', 'Go play'), true), 'mint') + B('finish', ic('check', 18) + ' ' + tx(T('끝내기', 'Finish'), true)) + speakBtn();
    return B(last() ? 'finish' : 'next', (last() ? ic('check', 18) : ic('next', 18)) + ' ' + tx(last() ? T('끝내기', 'Finish') : T('다음', 'Next'), true)) + speakBtn();
  };
  const sq = (n) => sqIdx(n);

  const mi = new MoveInput(board, {
    getGame: () => L.g,
    canMove: () => L.accept,
    onMove: (m) => onPlayerMove(m),
    onBlocked: () => { if (L.accept) { board.shake(); } },
  });
  const miTap = board.onTap;
  board.onTap = (s, d) => { if (L.step && L.step.t === 'tap') onTapSq(s); else miTap(s, d); };

  function doMove(m) {
    const g = L.g;
    g.make(m);
    board.setPosition(g); board.animate(m.f, m.t);
    board.clearMarks();
    board.mark({ last: [m.f, m.t], chk: g.inCheck() ? g.k[g.turn] : null });
    board.setArrows([]);
    sfx(g.inCheck() ? 'check' : m.c ? 'cap' : 'move');
  }
  function reject(msg, count) {
    if (count !== false) L.mistakes++;
    board.shake(); sfx('bad');
    say(msg, 'oops');
    mi.refresh();
  }

  function runStep(i) {
    L.i = i; L.tok++; L.accept = false; L.tapOn = false;
    const s = ch.steps[i]; L.step = s;
    const g = new Chess(s.fen); g.track = false; L.g = g;
    $('#dots').innerHTML = dotsHtml();
    const play = s.t === 'move' || s.t === 'mate' || s.t === 'seq';
    board.setView(s.t === 'seq' ? (s.side || 'w') : (play && g.turn === 1 ? 'b' : 'w'));
    board.setCoords(!!s.coords || S.coords);
    board.setPosition(g); board.clearMarks(); board.setArrows([]);
    mi.legal = []; mi.sel = null;
    const mk = {};
    if (s.hl) mk.hl = s.hl.map(sq);
    if (s.bad) mk.bad = s.bad.map(sq);
    if (s.moves) {
      try {
        const mv = g.legalFrom(sq(s.moves));
        mk.sel = sq(s.moves); mk.dots = mv.filter((m) => !m.c).map((m) => m.t); mk.caps = mv.filter((m) => m.c).map((m) => m.t);
      } catch (e) { /* ignore */ }
    }
    board.mark(mk);
    if (s.arrows) board.setArrows(s.arrows.map(([a, b]) => [sq(a), sq(b)]));
    acts.className = 'acts';
    if (s.t === 'say') { say(s.text); acts.innerHTML = nextBtn(); }
    else if (s.t === 'tap') { L.items = s.items; L.k = 0; L.tapOn = true; showTapItem(); }
    else if (s.t === 'move') { L.accept = true; mi.refresh(); say(s.text, 'think'); acts.innerHTML = hintBtn() + speakBtn(); }
    else if (s.t === 'mate') { L.mateN = s.n || 1; L.accept = true; mi.refresh(); say(s.text, 'think'); acts.innerHTML = hintBtn() + speakBtn(); }
    else if (s.t === 'seq') { L.seqI = 0; L.accept = true; mi.refresh(); say(s.text, 'happy'); showSeqHint(); acts.innerHTML = speakBtn(); }
    else if (s.t === 'quiz') {
      say(s.text, 'think');
      acts.classList.add('col');
      acts.innerHTML = s.choices.map((c, idx) => `<button class="btn sm lav ch" data-q="${idx}">${tx(c, false)}</button>`).join('');
    }
  }

  function showTapItem() { const it = L.items[L.k]; say(it.text, 'think'); acts.innerHTML = speakBtn(); }
  function onTapSq(s) {
    if (!L.tapOn) return;
    sfx('tap');
    const it = L.items[L.k];
    if (sqName(s) === it.sq) {
      sfx('good'); board.mark({ hl: [s], bad: [] }); L.k++;
      if (L.k >= L.items.length) {
        L.tapOn = false; say(T('모두 찾았어요! 대단해요!', 'You found them all! Great!'), 'cheer'); acts.innerHTML = nextBtn();
      } else {
        L.tapOn = false; const tok = L.tok;
        setTimeout(() => { if (L.dead || tok !== L.tok) return; L.tapOn = true; board.clearMarks(); showTapItem(); }, 550);
      }
    } else {
      L.mistakes++; board.shake(); sfx('bad'); board.mark({ bad: [s] });
      const tok = L.tok; setTimeout(() => { if (!L.dead && tok === L.tok) board.mark({ bad: [] }); }, 700);
      say(T(`그건 <b>${sqName(s)}</b> 칸이에요. 다시 찾아봐요!`, `That is <b>${sqName(s)}</b>. Try again!`), 'oops', '<div class="more">' + rich(it.text) + '</div>');
    }
  }

  function showSeqHint() {
    const st = L.step.line[L.seqI];
    const f = sq(st.m.slice(0, 2)), t = sq(st.m.slice(2, 4));
    board.setArrows([[f, t]]); board.mark({ hf: [f], ht: [t] });
  }

  async function onPlayerMove(m) {
    const s = L.step, g = L.g, tok = L.tok;
    if (s.t === 'move') {
      if (okMatch(s.ok, g, m)) {
        L.accept = false; doMove(m); sfx('good');
        say(s.win || T('좋아요!', 'Good!'), 'cheer'); acts.innerHTML = nextBtn();
      } else {
        const u = g.uci(m);
        reject((s.wrong && s.wrong[u]) || s.no || T('아쉬워요! 다시 한 번 생각해 봐요.', 'Not quite! Think once more.'));
      }
    } else if (s.t === 'mate') {
      const n = L.mateN;
      if (leadsToMate(g, m, n)) {
        L.accept = false; doMove(m);
        if (n === 1) {
          sfx('win'); say(s.win || T('체크메이트! 멋져요!', 'Checkmate! Wonderful!'), 'cheer'); acts.innerHTML = nextBtn();
        } else {
          say(T('좋은 수예요! 상대가 움직여요…', 'Good move! The opponent replies…'), 'think');
          await sleep(700); if (L.dead || tok !== L.tok) return;
          const rep = g.legal(); doMove(rep[Math.floor(Math.random() * rep.length)]);
          L.mateN = n - 1; L.accept = true; mi.refresh();
          say(T('상대가 움직였어요. 이제 <b>체크메이트</b>를 해 보세요!', 'The opponent moved. Now give <b>checkmate</b>!'), 'think');
        }
      } else {
        g.make(m); const stale = !g.inCheck() && g.legal().length === 0; g.unmake();
        reject(stale ? T('앗, 이러면 <b>스테일메이트</b>(무승부)가 돼요! 다른 수를 찾아봐요.', 'Oops, that is <b>stalemate</b> (a draw)! Find another move.')
          : n > 1 ? T('이 수로는 두 수 안에 체크메이트가 안 돼요. 다시 찾아봐요!', 'This does not force mate in two. Look again!')
            : (s.no || T('체크메이트가 아니에요. 킹이 아직 도망칠 수 있어요. 다시 찾아봐요!', 'That is not checkmate; the king can still escape. Look again!')));
      }
    } else if (s.t === 'seq') {
      const st = s.line[L.seqI];
      if (g.uci(m) === st.m) {
        L.accept = false; doMove(m); sfx('good');
        say(st.say, 'cheer');
        if (st.r) {
          await sleep(750); if (L.dead || tok !== L.tok) return;
          const r = g.findUci(st.r); if (r) doMove(r);
        }
        L.seqI++;
        if (L.seqI >= s.line.length) {
          say(st.say, 'cheer', '<div class="more">' + tx(T('끝까지 따라 했어요! 잘했어요!', 'You followed it all the way! Well done!')) + '</div>'); acts.innerHTML = nextBtn();
        } else {
          L.accept = true; mi.refresh(); showSeqHint();
          say(st.say, 'happy', '<div class="more">' + tx(T('다음 화살표를 따라 해요.', 'Follow the next arrow.')) + '</div>');
        }
      } else reject(T('화살표를 따라 해 봐요!', 'Follow the arrow!'), false);
    }
  }

  function hint() {
    const s = L.step, g = L.g;
    if (!L.accept || (s.t !== 'move' && s.t !== 'mate')) return;
    const c = g.legal().filter((m) => (s.t === 'move' ? okMatch(s.ok, g, m) : leadsToMate(g, m, L.mateN)));
    if (!c.length) return;
    L.mistakes++;
    const m = c[0];
    board.setArrows([[m.f, m.t]]); board.mark({ hf: [m.f], ht: [m.t] });
    say(s.text, 'wink', '<div class="more">' + tx(T('화살표를 따라 해 봐요. (별이 줄어들 수 있어요)', 'Try the arrow move. (You may earn fewer stars.)')) + '</div>');
  }

  async function finish(goPlay) {
    if (L.done) return; L.done = true;
    const st = L.mistakes === 0 ? 3 : L.mistakes <= 2 ? 2 : 1;
    const prev = (S.progress[ch.id] || {}).stars || 0;
    S.progress[ch.id] = { stars: Math.max(prev, st) };
    touchStreak(); saveNow();
    if (goPlay) { go('setup', { mode: 'cpu' }); return; }
    sfx('win');
    const idx = all.findIndex((c) => c.id === ch.id), nx = all[idx + 1];
    const nxOk = nx && (Content.basic.includes(nx) || Content.basic.every((c) => chapDone(c.id)) || S.proOpen);
    const msg = st === 3 ? T('실수 없이 해냈어요! 최고예요!', 'No mistakes! You are amazing!') : st === 2 ? T('잘했어요! 다음엔 별 3개에 도전해 봐요.', 'Well done! Try for 3 stars next time.') : T('끝까지 해냈어요! 다시 하면 별을 더 받을 수 있어요.', 'You finished! Play again to earn more stars.');
    const k = await ask({
      lion: 'cheer', title: T('단원 완료!', 'Chapter complete!'),
      html: `<div style="font-size:2.4rem;display:flex;justify-content:center" class="pop-star">${stars(st)}</div><p>${rich(msg)}</p>`,
      buttons: [nxOk ? { k: 'next', label: T('다음 단원', 'Next chapter'), cls: 'mint' } : null, { k: 'again', label: T('다시 하기', 'Again'), cls: 'ghost' }, { k: 'map', label: T('단원 목록', 'Chapters'), cls: 'lav' }].filter(Boolean),
    });
    if (L.dead) return;
    if (k === 'next') go('lesson', { ch: nx.id }); else if (k === 'again') go('lesson', { ch: ch.id }); else go('learn');
  }

  root.addEventListener('click', (e) => {
    const b = e.target.closest('[data-a],[data-q]'); if (!b) return;
    sfx('tap');
    if (b.dataset.q != null) {
      const c = L.step.choices[+b.dataset.q];
      if (c.ok) { sfx('good'); say(L.step.win, 'cheer'); acts.classList.remove('col'); acts.innerHTML = nextBtn(); }
      else { L.mistakes++; sfx('bad'); b.disabled = true; say(L.step.no, 'oops', '<div class="more">' + tx(L.step.text) + '</div>'); }
      return;
    }
    const a = b.dataset.a;
    if (a === 'next') runStep(L.i + 1);
    else if (a === 'finish') finish(false);
    else if (a === 'play') finish(true);
    else if (a === 'hint') hint();
    else if (a === 'speak') speak(L.step.text);
  });
  runStep(0);
};

</script>
<script>
/* Game screen: vs computer and 2-player (optionally face to face), clocks, hints, safety check. */
'use strict';
const PVAL_UI = { 1: 1, 2: 3, 3: 3, 4: 5, 5: 9, 6: 0 };
function canMateWith(g, color) {
  let minors = 0;
  for (let s = 0; s < 64; s++) {
    const p = g.b[s]; if (!p || (p >> 3) !== color) continue;
    const t = p & 7;
    if (t === 1 || t === 4 || t === 5) return true;
    if (t === 2 || t === 3) minors++;
  }
  return minors >= 2;
}
const shortL = (o) => (S.lang === 'en' ? o.en : o.ko);

Views.game = (root, params) => {
  if (params.net && !params.gdoc) {
    root.innerHTML = `<div class="scroll"><div class="wrap"><p style="text-align:center;margin-top:40px">${tx(T('대국을 불러오는 중…', 'Loading the game…'))}</p></div></div>`;
    setTop({ back: 'online', title: T('온라인 대국', 'Online game') });
    withTimeout(Cloud.get('games/' + params.net)).then((d) => {
      if (V.params !== params) return;
      if (!d) { toast(T('이 대국을 찾을 수 없어요', 'This game was not found')); go('online'); return; }
      go('game', { net: params.net, gdoc: d });
    }).catch((e) => { toast(errText(e)); go('online'); });
    return;
  }
  const su = S.setup;
  const NG = params.net ? params.gdoc : null;
  let cfg, startMoves = [], startClk = null;
  if (NG) {
    const myc = NG.white.pid === S.cloud.pid ? 0 : 1;
    cfg = { mode: 'net', me: myc, f2f: false, hint: false, safety: su.safety, undo: false, clock: NG.clock, gid: params.net, level: 0 };
    startMoves = NG.moves || []; startClk = NG.clock ? { base: NG.clock.min * 60000, inc: NG.clock.inc, t: (NG.t || [0, 0]).slice() } : null;
  } else if (params.resume) {
    if (!S.game) { go('home'); return; }
    cfg = S.game.cfg; startMoves = S.game.moves || []; startClk = S.game.clk;
  } else if (params.cfg) {
    cfg = clone(params.cfg);
    if (cfg.mode === 'cpu' && su.color === 'r') cfg.me = Math.random() < 0.5 ? 0 : 1;
  } else {
    cfg = { mode: su.mode, level: su.level, me: su.mode === 'cpu' ? (su.color === 'r' ? (Math.random() < 0.5 ? 0 : 1) : su.color === 'w' ? 0 : 1) : null, f2f: su.mode === '2p' && su.f2f, hint: su.hint, safety: su.safety, undo: su.undo, clock: clockCfg(su) };
  }
  const G = { cfg, g: null, moves: [], sans: [], cap: [[], []], over: false, tok: 0, busy: false, paused: false, pauseBy: '', hints: 0, hintBusy: false, view: cfg.mode !== '2p' ? (cfg.me === 1 ? 'b' : 'w') : 'w', clk: null, dead: false };
  if (cfg.clock) {
    const b = cfg.clock.min * 60000;
    G.clk = startClk ? { base: startClk.base, inc: startClk.inc, t: startClk.t.slice(), run: -1, last: Date.now() } : { base: b, inc: cfg.clock.inc, t: [b, b], run: -1, last: Date.now() };
  }

  setTop({ back: () => { persist(); go(NG ? 'online' : 'home'); }, title: NG ? T('온라인 대국', 'Online game') : cfg.mode === 'cpu' ? T('컴퓨터와 대국', 'Play Computer') : T('둘이서 대국', '2 Players') });
  const f2f = cfg.f2f;
  root.innerHTML = f2f
    ? `<div class="game f2f"><div class="seat rot"><div class="pbar" id="pbT"></div><div class="msg"><div class="bubble" id="msgT"></div></div><div class="dock" id="dockT"></div></div>
        <div class="boardwrap" id="bw"></div>
        <div class="seat"><div class="pbar" id="pbB"></div><div class="msg"><div class="bubble" id="msgB"></div></div><div class="dock" id="dockB"></div></div></div>`
    : `<div class="game side"><div class="pbar" id="pbT"></div><div class="boardwrap" id="bw"></div><div class="pbar" id="pbB"></div><div class="moves" id="mv"></div><div class="dock" id="dock"></div>
        <div class="coach"><div id="lion"></div><div class="bubble" id="msg"></div></div></div>`;
  const board = new Board();
  board.f2f = f2f;
  if (f2f) board.setCoords(false); else board.setCoords(S.coords);
  const bw = $('#bw', root); bw.appendChild(board.el);
  board.setView(G.view);

  /* ---------- state helpers ---------- */
  function pushMove(m) {
    const g = G.g, mover = g.turn;
    G.sans.push(g.san(m)); G.moves.push(g.uci(m));
    if (m.c) G.cap[mover].push(m.c & 7);
    g.make(m);
  }
  function replay(list) {
    G.g = new Chess(START); G.g.track = true; G.moves = []; G.sans = []; G.cap = [[], []];
    for (const u of list) { const m = G.g.findUci(u); if (!m) break; pushMove(m); }
  }
  function persist() {
    if (NG) return;
    if (G.over || G.dead && !G.moves.length) return;
    if (G.clk) settle();
    S.game = { cfg, moves: G.moves.slice(), clk: G.clk ? { base: G.clk.base, inc: G.clk.inc, t: G.clk.t.slice() } : null, over: false };
    save();
  }

  /* ---------- clock ---------- */
  function settle() {
    const k = G.clk; if (!k) return;
    const now = Date.now();
    if (k.run >= 0 && !G.paused) k.t[k.run] -= now - k.last;
    k.last = now;
  }
  function fmt(ms) {
    ms = Math.max(0, ms);
    if (ms < 20000) return (Math.floor(ms / 100) / 10).toFixed(1);
    const s = Math.ceil(ms / 1000);
    return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
  }
  function updateClocks() {
    const k = G.clk; if (!k) return;
    $$('.clock', root).forEach((el) => {
      const c = +el.dataset.c, t = k.t[c];
      el.textContent = fmt(t);
      el.classList.toggle('low', t < 30000);
      el.classList.toggle('run', k.run === c && !G.paused);
    });
  }
  function tick() {
    const k = G.clk; if (!k || G.over || G.dead) return;
    if (k.run >= 0) {
      settle();
      if (k.t[k.run] <= 0) { const c = k.run; k.t[c] = 0; updateClocks(); timeout(c); return; }
    } else k.last = Date.now();
    updateClocks();
  }
  const tickT = setInterval(tick, 200);
  let unsubGame = null;
  function timeout(c) {
    if (NG && c !== cfg.me) {
      if (!G.tg) G.tg = setTimeout(() => { G.tg = 0; if (!G.over && G.clk.run === c && G.clk.t[c] <= 0) timeout2(c); }, 3500);
      return;
    }
    timeout2(c);
  }
  function timeout2(c) {
    if (!canMateWith(G.g, c ^ 1)) finish({ winner: -1, reason: 'timedraw' });
    else finish({ winner: c ^ 1, reason: 'time' });
  }
  function pause(by) {
    if (G.paused || NG) return false;
    settle(); G.paused = true; G.pauseBy = by; bw.classList.add('hide'); updateClocks(); return true;
  }
  function resume(by) {
    if (!G.paused || G.pauseBy !== by) return;
    G.paused = false; G.pauseBy = ''; if (G.clk) G.clk.last = Date.now(); bw.classList.remove('hide'); updateClocks();
  }
  const hookP = () => { if (!G.over) pause('lock'); };
  const hookR = () => resume('lock');
  Hooks.pause.push(hookP); Hooks.resume.push(hookR);
  const onVis = () => {
    if (G.over || G.dead) return;
    if (document.visibilityState === 'hidden') { if (G.clk) pause('vis'); }
    else if (G.paused && G.pauseBy === 'vis') showPaused();
  };
  document.addEventListener('visibilitychange', onVis);
  async function showPaused() {
    await ask({ lion: 'sleep', title: T('잠깐 멈췄어요', 'Paused'), text: T('시계도 멈춰 있어요. 준비되면 계속해요!', 'The clock is paused. Continue when you are ready!'), buttons: [{ k: 'go', label: T('계속하기', 'Continue'), cls: 'mint' }] });
    resume('vis');
  }
  V.cleanup = () => {
    G.dead = true; G.tok++; clearInterval(tickT); clearTimeout(G.rb); clearTimeout(G.tg); if (unsubGame) unsubGame();
    document.removeEventListener('visibilitychange', onVis);
    if (typeof onHk === 'function') Layer.removeEventListener('click', onHk);
    Hooks.pause = Hooks.pause.filter((f) => f !== hookP); Hooks.resume = Hooks.resume.filter((f) => f !== hookR);
    persist();
  };

  /* ---------- rendering ---------- */
  const mineColor = () => (cfg.mode !== '2p' ? cfg.me : G.g.turn);
  function barHtml(c) {
    const g = G.g;
    let av, nm, sub = '';
    if (cfg.mode === 'net') {
      const pl = c === 0 ? NG.white : NG.black;
      av = avHtml(pl.avatar, 34); nm = esc(pl.nick); sub = c === cfg.me ? tx(T('나', 'Me'), true) : '';
    } else if (cfg.mode === 'cpu' && c !== cfg.me) { av = Art.lion(LEVEL_MOOD[cfg.level]); nm = tx(T('레오', 'Leo'), true); sub = tx(AI.LEVELS[cfg.level].name, true) + (G.busy ? ' …' : ''); }
    else {
      av = `<svg viewBox="0 0 100 100"><use href="#${c ? 'b' : 'w'}K"/></svg>`;
      nm = cfg.mode === 'cpu' ? tx(T('나', 'Me'), true) : tx(c ? T('검은색', 'Black') : T('흰색', 'White'), true);
    }
    const mine = G.cap[c].slice().sort((a, b) => b - a);
    const adv = G.cap[c].reduce((a, t) => a + PVAL_UI[t], 0) - G.cap[c ^ 1].reduce((a, t) => a + PVAL_UI[t], 0);
    const caps = mine.map((t) => `<svg viewBox="0 0 100 100"><use href="#${c ? 'w' : 'b'}${PTYPE[t - 1]}"/></svg>`).join('') + (adv > 0 ? `<span class="adv">+${adv}</span>` : '');
    const clk = G.clk ? `<div class="clock" data-c="${c}">${fmt(G.clk.t[c])}</div>` : '';
    return `<div class="av">${av}</div><div class="nm">${nm}${sub ? `<small>${sub}</small>` : ''}</div><div class="cap">${caps}</div>${clk}`;
  }
  function renderBars() {
    const topC = f2f ? 1 : (G.view === 'w' ? 1 : 0), botC = topC ^ 1;
    const t = $('#pbT', root), b = $('#pbB', root);
    t.innerHTML = barHtml(topC); b.innerHTML = barHtml(botC);
    t.classList.toggle('turn', !G.over && G.g.turn === topC); b.classList.toggle('turn', !G.over && G.g.turn === botC);
    updateClocks();
  }
  function renderMoves() {
    const mv = $('#mv', root); if (!mv) return;
    let s = '';
    for (let i = 0; i < G.sans.length; i += 2) s += `<span><b>${i / 2 + 1}.</b> ${G.sans[i]} ${G.sans[i + 1] || ''}</span>`;
    mv.innerHTML = s; mv.scrollLeft = mv.scrollWidth;
  }
  function dockHtml(c) {
    const cc = c == null ? '' : c;
    const bt = (a, icon, label, cls) => `<button class="btn sm ${cls || ''}" data-a="${a}" data-c="${cc}" aria-label="${label.en}">${ic(icon, 20)} <span>${shortL(label)}</span></button>`;
    return (cfg.hint ? bt('hint', 'bulb', T('훈수', 'Hint'), 'lav') : '') + bt('danger', 'shield', T('위험?', 'Danger?'), 'mint') + (cfg.undo ? bt('undo', 'undo', T('무르기', 'Undo'), 'ghost') : '') +
      (f2f ? '' : bt('flip', 'flip', T('뒤집기', 'Flip'), 'ghost')) + (NG ? bt('hi', 'chat', T('인사', 'Hi'), 'pink') : '') + bt('menu', 'menu', T('메뉴', 'Menu'), 'ghost');
  }
  function renderDocks() {
    if (f2f) { $('#dockT', root).innerHTML = dockHtml(1); $('#dockB', root).innerHTML = dockHtml(0); } else $('#dock', root).innerHTML = dockHtml(null);
    updateBadges();
  }
  function updateBadges() {
    $$('[data-a="danger"]', root).forEach((b) => {
      b.querySelector('.badge') && b.querySelector('.badge').remove();
      if (G.over) return;
      const c = b.dataset.c === '' ? mineColor() : +b.dataset.c;
      if (cfg.mode === '2p' && c !== G.g.turn) return;
      if (cfg.mode !== '2p' && G.g.turn !== cfg.me) return;
      if (Coach.danger(G.g, c).length) b.insertAdjacentHTML('beforeend', '<i class="badge"></i>');
    });
  }
  function setMsg(color, o, mood) {
    const html = typeof o === 'string' ? o : (o ? rich(o) : '');
    if (f2f) { const el = $(color === 1 ? '#msgT' : '#msgB', root); if (el) el.innerHTML = html; }
    else { $('#lion', root).innerHTML = Art.lion(mood || 'happy'); $('#msg', root).innerHTML = html; }
  }
  function turnMsg() {
    const g = G.g, c = g.turn, chk = g.inCheck();
    if (cfg.mode === 'net') {
      if (G.doc && G.doc.status === 'invite') setMsg(c, T('친구가 받을 때까지 기다려요…', 'Waiting for your friend…'), 'think');
      else if (c === cfg.me) setMsg(c, chk ? T('체크예요! 킹을 지켜야 해요.', 'Check! Protect your king.') : T('내 차례예요!', 'Your turn!'), chk ? 'oops' : 'happy');
      else setMsg(c, T('친구가 생각하고 있어요…', 'Your friend is thinking…'), 'think');
    } else if (cfg.mode === 'cpu') {
      if (c === cfg.me) setMsg(c, chk ? T('체크예요! 킹을 지켜야 해요.', 'Check! Protect your king.') : T('내 차례예요. 말을 눌러 움직여 봐요!', 'Your turn! Tap a piece to move.'), chk ? 'oops' : 'happy');
      else setMsg(c, T('레오가 생각하고 있어요…', 'Leo is thinking…'), 'think');
    } else {
      const nm = c === 0 ? T('흰색', 'White') : T('검은색', 'Black');
      const t = chk ? T(`${nm.ko} 차례 · 체크!`, `${nm.en} to move · Check!`) : T(`${nm.ko} 차례예요`, `${nm.en} to move`);
      if (f2f) { setMsg(c, t); setMsg(c ^ 1, ''); } else setMsg(c, t, chk ? 'oops' : 'happy');
    }
  }
  function syncBoard() {
    board.setPosition(G.g);
    board.clearMarks();
    const lm = G.g.stack.length ? G.g.stack[G.g.stack.length - 1].m : null;
    board.mark({ last: lm ? [lm.f, lm.t] : [], chk: G.g.inCheck() ? G.g.k[G.g.turn] : null });
    board.setArrows([]);
    mi.refresh();
  }

  /* ---------- input ---------- */
  const mi = new MoveInput(board, {
    getGame: () => G.g,
    canMove: (color) => !G.over && !G.paused && !G.dead && (!NG || (G.doc && G.doc.status === 'active')) && (cfg.mode === '2p' || color === cfg.me),
    onMove: (m) => onHumanMove(m),
    onBlocked: () => { board.shake(); sfx('bad'); },
  });
  async function onHumanMove(m) {
    if (G.over) return;
    if (cfg.safety) {
      const w = Coach.safetyCheck(G.g, m);
      if (w) {
        const k = await ask({ lion: 'oops', text: Coach.safetyText(w), buttons: [{ k: 'no', label: T('다시 생각할게요', 'Let me rethink'), cls: 'mint' }, { k: 'yes', label: T('그래도 둘래요', 'Play it anyway'), cls: 'ghost' }], flipped: f2f && G.g.turn === 1 });
        mi.refresh();
        if (G.over) return;
        if (k !== 'yes') { board.mark({ bad: [w.sq] }); return; }
      }
    }
    applyMove(m);
  }
  function applyMove(m, remote) {
    const g = G.g, mover = g.turn;
    if (G.clk) {
      settle();
      if (G.moves.length > 0) G.clk.t[mover] += G.clk.inc * 1000;
    }
    pushMove(m);
    if (G.clk) { G.clk.run = G.moves.length >= 1 ? g.turn : -1; G.clk.last = Date.now(); }
    if (NG && !remote) sendMove();
    board.setPosition(g); board.animate(m.f, m.t);
    board.clearMarks();
    board.mark({ last: [m.f, m.t], chk: g.inCheck() ? g.k[g.turn] : null });
    board.setArrows([]);
    const st = g.status();
    sfx(st.over && st.reason === 'mate' ? 'check' : g.inCheck() ? 'check' : m.c ? 'cap' : 'move');
    mi.refresh();
    renderMoves(); renderBars();
    if (st.over) { finish({ winner: st.winner, reason: st.reason }, remote); return; }
    persist(); turnMsg(); updateBadges();
    if (cfg.mode === 'cpu' && g.turn !== cfg.me) aiTurn();
  }
  async function aiTurn() {
    if (G.over) return;
    const tok = ++G.tok; G.busy = true; renderBars(); turnMsg();
    const t0 = Date.now();
    let r = null;
    try { r = await AIC.move(G.g.fen(), G.g.keys.slice(), cfg.level); } catch (e) { r = null; }
    await sleep(Math.max(0, (G.clk ? 350 : 650 + Math.random() * 650) - (Date.now() - t0)));
    while (G.paused && tok === G.tok && !G.over && !G.dead) await sleep(150);
    if (tok !== G.tok || G.over || G.dead) return;
    G.busy = false;
    let m = r && r.uci ? G.g.findUci(r.uci) : null;
    if (!m) { const l = G.g.legal(); m = l[Math.floor(Math.random() * l.length)]; }
    applyMove(m);
  }

  /* ---------- helpers: hint, danger, undo ---------- */
  async function doHint(color) {
    if (G.over || G.hintBusy) return;
    const g = G.g;
    if (cfg.mode === 'cpu' && g.turn !== cfg.me) { toast(T('레오 차례예요', 'It is Leo\'s turn')); return; }
    if (cfg.mode === '2p' && color !== '' && +color !== g.turn) { toast(T('내 차례에 눌러 주세요', 'Tap it on your own turn')); return; }
    G.hintBusy = true;
    const n = G.moves.length, who = g.turn;
    setMsg(who, T('레오가 좋은 수를 찾고 있어요…', 'Leo is looking for a good move…'), 'think');
    let info = null;
    try { info = await AIC.analyze(g.fen(), 1300, 6); } catch (e) { info = null; }
    G.hintBusy = false;
    if (G.over || G.dead || G.moves.length !== n) return;
    const m = info && info.uci ? g.findUci(info.uci) : null;
    if (!m) { setMsg(who, T('지금은 힌트를 못 찾았어요', 'No hint right now')); return; }
    const ex = Coach.explain(g, m, { cp: info.score, mate: info.mate, pv: info.pv });
    G.hints++;
    board.setArrows([[m.f, m.t]]); board.mark({ hf: [m.f], ht: [m.t] });
    const line = ex.line && ex.line.length ? `<div class="more">${tx(T('예상 진행', 'Expected line'), true)}: ${ex.line.join(' ')}</div>` : '';
    setMsg(who, `<b>${tx(T('훈수', 'Hint'), true)}: ${ex.san}</b> <span style="opacity:.7">(${ex.from} → ${ex.to})</span><ul>${ex.reasons.map((r) => `<li>${rich(r)}</li>`).join('')}</ul><div class="more">${rich(ex.ev)}</div>${line}`, 'wink');
  }
  function doDanger(color) {
    if (G.over) return;
    const c = cfg.mode !== '2p' ? cfg.me : (color === '' ? G.g.turn : +color);
    const list = Coach.danger(G.g, c);
    if (!list.length) { board.mark({ bad: [] }); setMsg(c, T('위험한 내 말이 없어요. 안전해요!', 'None of your pieces is in danger. All safe!'), 'happy'); return; }
    board.mark({ bad: list.map((d) => d.sq) });
    setMsg(c, `<b>${tx(T('조심!', 'Careful!'), true)}</b><ul>${Coach.dangerLines(list).map((l) => `<li>${rich(l)}</li>`).join('')}</ul>`, 'oops');
  }
  function doUndo() {
    if (G.over || !cfg.undo) return;
    const n = G.moves.length;
    let drop = 1;
    if (cfg.mode === 'cpu') drop = G.g.turn === cfg.me ? 2 : 1;
    if (n < drop || (cfg.mode === 'cpu' && (n - drop) % 2 !== cfg.me)) { toast(T('더 이상 무를 수 없어요', 'Nothing more to take back')); return; }
    G.tok++; G.busy = false; G.hintBusy = false;
    replay(G.moves.slice(0, n - drop));
    if (G.clk) { G.clk.run = G.moves.length >= 1 ? G.g.turn : -1; G.clk.last = Date.now(); }
    syncBoard(); renderMoves(); renderBars(); turnMsg(); updateBadges(); persist();
    toast(T('한 수 물렀어요', 'Took back a move'));
  }
  function doFlip() {
    G.view = G.view === 'w' ? 'b' : 'w';
    board.setView(G.view); board.setPosition(G.g); board.mark({}); board.setArrows([]); renderBars();
  }

  /* ---------- menu, draw, resign ---------- */
  function pgnText() {
    let s = '[Event "Daily Chess"]\n[Date "' + ymd().replace(/-/g, '.') + '"]\n\n';
    G.sans.forEach((m, i) => { if (i % 2 === 0) s += (i / 2 + 1) + '. '; s += m + ' '; });
    return s.trim();
  }
  async function copyPgn() {
    const text = pgnText();
    try { await navigator.clipboard.writeText(text); toast(T('기보를 복사했어요', 'Moves copied')); }
    catch (e) { await ask({ title: T('기보', 'Moves'), html: `<textarea class="input" readonly rows="5" style="text-align:left">${text}</textarea>`, buttons: [{ k: 'ok', label: T('닫기', 'Close') }] }); }
  }
  async function openMenu(color) {
    const c = color === '' || color == null ? null : +color;
    if (G.over) {
      const k = await ask({ lion: 'happy', title: T('대국이 끝났어요', 'Game over'), buttons: [NG ? null : { k: 'again', label: T('한 판 더', 'Play again'), cls: 'mint' }, { k: 'copy', label: T('기보 복사', 'Copy moves'), cls: 'ghost' }, { k: 'home', label: NG ? T('친구 화면으로', 'Back to friends') : T('홈으로', 'Home'), cls: 'lav' }].filter(Boolean) });
      overAction(k); return;
    }
    const did = pause('menu');
    const btns = [{ k: 'cont', label: T('계속하기', 'Resume'), cls: 'mint' }, { k: 'draw', label: T('무승부 제안', 'Offer a draw'), cls: 'lav' }];
    if (NG) btns.push({ k: 'resign' + cfg.me, label: T('기권하기', 'Resign'), cls: 'pink' });
    else if (cfg.mode === 'cpu') btns.push({ k: 'resign0', label: T('기권하기', 'Resign'), cls: 'pink' });
    else if (f2f && c != null) btns.push({ k: 'resign' + c, label: T('기권하기', 'Resign'), cls: 'pink' });
    else btns.push({ k: 'resign0', label: T('흰색 기권', 'White resigns'), cls: 'pink' }, { k: 'resign1', label: T('검은색 기권', 'Black resigns'), cls: 'pink' });
    btns.push({ k: 'copy', label: T('기보 복사', 'Copy moves'), cls: 'ghost' });
    if (!NG) btns.push({ k: 'new', label: T('새 게임', 'New game'), cls: 'ghost' });
    btns.push({ k: 'home', label: NG ? T('친구 화면으로', 'Back to friends') : T('홈으로', 'Home'), cls: 'ghost' });
    const k = await ask({ lion: 'think', title: T('잠깐 멈춤', 'Paused'), text: NG ? T('온라인 대국에서는 시계가 멈추지 않아요.', 'The clock keeps running in online games.') : G.clk ? T('시계도 멈췄어요.', 'The clock is paused too.') : null, buttons: btns, flipped: f2f && c === 1 });
    if (did) resume('menu');
    if (G.over || G.dead) return;
    if (k === 'draw') offerDraw(c);
    else if (k === 'copy') copyPgn();
    else if (k === 'home') { persist(); go(NG ? 'online' : 'home'); }
    else if (k === 'new') {
      const y = await ask({ lion: 'oops', title: T('새 게임을 할까요?', 'Start a new game?'), text: T('지금 대국은 사라져요.', 'This game will be lost.'), buttons: [{ k: 'y', label: T('새 게임', 'New game'), cls: 'pink' }, { k: 'n', label: T('아니요', 'No'), cls: 'ghost' }] });
      if (y === 'y') { S.game = null; saveNow(); go('setup', { mode: cfg.mode }); }
    } else if (k && k.startsWith('resign')) {
      const rc = +k.slice(6);
      const y = await ask({ lion: 'oops', title: T('정말 기권할까요?', 'Really resign?'), buttons: [{ k: 'y', label: T('기권', 'Resign'), cls: 'pink' }, { k: 'n', label: T('계속 두기', 'Keep playing'), cls: 'mint' }], flipped: f2f && rc === 1 });
      if (y === 'y') finish({ winner: cfg.mode === 'cpu' ? cfg.me ^ 1 : rc ^ 1, reason: 'resign' });
    }
  }
  async function offerDraw(c) {
    if (NG) {
      try { await withTimeout(Cloud.update('games/' + cfg.gid, { drawOffer: cfg.me, updatedAt: Date.now() })); toast(T('무승부를 제안했어요. 친구의 답을 기다려요.', 'Draw offered. Waiting for your friend.'), 3500); }
      catch (e) { toast(errText(e)); }
      return;
    }
    if (cfg.mode === 'cpu') {
      pause('draw');
      setMsg(0, T('레오가 생각 중이에요…', 'Leo is thinking…'), 'think');
      let info = null;
      try { info = await AIC.analyze(G.g.fen(), 700, 4); } catch (e) { info = null; }
      resume('draw');
      if (G.over || G.dead) return;
      const aiScore = info ? (G.g.turn === cfg.me ? -info.score : info.score) : 0;
      const accept = aiScore <= -120 || (G.moves.length >= 60 && Math.abs(aiScore) < 80);
      if (accept) { await ask({ lion: 'wink', title: T('레오가 받았어요', 'Leo accepts'), text: T('좋아요, 무승부로 해요!', 'Okay, let us call it a draw!'), buttons: [{ k: 'ok', label: T('확인', 'OK') }] }); finish({ winner: -1, reason: 'agree' }); }
      else { turnMsg(); await ask({ lion: 'think', title: T('레오는 더 두고 싶대요', 'Leo wants to play on'), text: T('조금 더 해 봐요!', 'Let us play a bit longer!'), buttons: [{ k: 'ok', label: T('좋아요', 'OK'), cls: 'mint' }] }); }
    } else {
      pause('draw');
      const k = await ask({ lion: 'think', title: T('무승부 제안', 'Draw offer'), text: T('상대가 무승부를 제안했어요. 받을까요?', 'Your opponent offers a draw. Accept?'), buttons: [{ k: 'y', label: T('받을게요', 'Accept'), cls: 'mint' }, { k: 'n', label: T('아니요', 'Decline'), cls: 'ghost' }], flipped: f2f && c === 0 });
      resume('draw');
      if (k === 'y') finish({ winner: -1, reason: 'agree' });
    }
  }

  /* ---------- game over ---------- */
  const REASONS = {
    mate: [T('체크메이트!', 'Checkmate!'), T('킹이 도망갈 곳도, 막을 방법도 없어요.', 'The king has no escape and nothing can stop the check.')],
    stalemate: [T('스테일메이트 — 무승부', 'Stalemate — a draw'), T('둘 수 있는 수가 없는데 체크도 아니에요. 이럴 땐 무승부예요.', 'There is no legal move but the king is not in check. That is a draw.')],
    insufficient: [T('말이 모자라요 — 무승부', 'Not enough pieces — a draw'), T('남은 말로는 체크메이트를 만들 수 없어요.', 'Checkmate is impossible with the pieces left.')],
    fifty: [T('50수 규칙 — 무승부', '50-move rule — a draw'), T('50수 동안 폰도 안 움직이고 잡기도 없었어요.', 'Fifty moves passed with no pawn move or capture.')],
    repetition: [T('같은 모양 3번 — 무승부', 'Threefold repetition — a draw'), T('같은 모양이 세 번 나왔어요.', 'The same position appeared three times.')],
    agree: [T('무승부 합의', 'Draw agreed'), T('서로 무승부에 동의했어요.', 'Both players agreed to a draw.')],
    resign: [T('기권', 'Resignation'), T('한쪽이 졌다고 인정했어요.', 'One player gave up.')],
    time: [T('시간 초과', 'Time is up'), T('시계가 0이 되었어요. (깃발이 떨어졌어요)', 'The clock reached 0. (The flag fell.)')],
    timedraw: [T('시간 초과 — 무승부', 'Time out — a draw'), T('시간이 다 됐지만 상대는 체크메이트할 말이 없어서 무승부예요.', 'Time ran out, but the opponent cannot checkmate, so it is a draw.')],
  };
  function finish(res, remote) {
    if (G.over) return;
    G.over = true; G.tok++; G.busy = false;
    if (G.clk) { settle(); G.clk.run = -1; }
    closeAllModals(); bw.classList.remove('hide'); G.paused = false;
    G.res = res;
    if (NG) {
      if (!remote) Cloud.update('games/' + cfg.gid, { status: 'over', result: res, liveUids: [], drawOffer: -1, updatedAt: Date.now() }).catch(() => {});
      S.cloud.done = S.cloud.done || [];
      if (!S.cloud.done.includes(cfg.gid)) {
        S.cloud.done.push(cfg.gid); if (S.cloud.done.length > 40) S.cloud.done.shift();
        S.stats.games++; const nt = S.stats.net || (S.stats.net = { w: 0, l: 0, d: 0 });
        if (res.winner === -1) nt.d++; else if (res.winner === cfg.me) nt.w++; else nt.l++;
      }
    } else { S.game = null; S.stats.games++; }
    if (cfg.mode === 'cpu') {
      const bucket = res.winner === -1 ? 'draws' : res.winner === cfg.me ? 'wins' : 'losses';
      S.stats[bucket][cfg.level] = (S.stats[bucket][cfg.level] || 0) + 1;
    }
    touchStreak(); saveNow();
    renderBars(); updateBadges();
    const g = G.g;
    board.mark({ chk: res.reason === 'mate' ? g.k[g.turn] : null });
    const win = cfg.mode !== '2p' ? res.winner === cfg.me : res.winner !== -1;
    sfx(res.winner === -1 ? 'tick' : win ? 'win' : 'lose');
    setTimeout(() => { if (!G.dead) showResult(); }, 700);
  }
  async function showResult() {
    const res = G.res, [ttl, why] = REASONS[res.reason];
    let head, mood;
    if (res.winner === -1) { head = T('무승부예요', 'It is a draw'); mood = 'wink'; }
    else if (cfg.mode === 'cpu') {
      if (res.winner === cfg.me) { head = T('내가 이겼어요!', 'You won!'); mood = 'cheer'; }
      else { head = T('이번엔 레오가 이겼어요', 'Leo won this time'); mood = 'happy'; }
    } else if (NG) {
      if (res.winner === cfg.me) { head = T('내가 이겼어요!', 'You won!'); mood = 'cheer'; }
      else { head = T('이번엔 졌어요', 'You lost this time'); mood = 'happy'; }
    } else { head = res.winner === 0 ? T('흰색 승리!', 'White wins!') : T('검은색 승리!', 'Black wins!'); mood = 'cheer'; }
    const tip = cfg.mode === 'cpu' && res.winner !== -1 && res.winner !== cfg.me ? T('좋은 승부였어요! 다시 도전하면 더 잘할 수 있어요. \'수고하셨습니다\'!', 'Good game! Try again and you will do even better. Good game!') : T('서로 \'수고하셨습니다\' 인사를 해요!', 'Shake hands and say \'good game\'!');
    const k = await ask({
      lion: mood, title: head,
      html: `<p><b>${tx(ttl, true)}</b><br>${rich(why)}</p><p style="font-size:.92rem;color:var(--ink2)">${rich(tip)}</p>`,
      buttons: [NG ? null : { k: 'again', label: T('한 판 더', 'Play again'), cls: 'mint' }, { k: 'view', label: T('판 보기', 'Review board'), cls: 'ghost' }, { k: 'copy', label: T('기보 복사', 'Copy moves'), cls: 'ghost' }, { k: 'home', label: NG ? T('친구 화면으로', 'Back to friends') : T('홈으로', 'Home'), cls: 'lav' }].filter(Boolean),
    });
    if (G.dead) return;
    overAction(k);
  }
  function overAction(k) {
    if (k === 'again') go('game', { fresh: true, cfg });
    else if (k === 'home') go(NG ? 'online' : 'home');
    else if (k === 'copy') { copyPgn(); }
  }

  /* ---------- online game ---------- */
  const HI = [['gl', T('잘 부탁드립니다!', 'Good luck!')], ['gm', T('좋은 수예요!', 'Nice move!')], ['op', T('아깝네요!', 'So close!')], ['wt', T('잠깐 생각할게요', 'Let me think')], ['gg', T('수고하셨습니다!', 'Good game!')], ['rm', T('한 판 더 해요!', 'Rematch?')]];
  const hiText = (k) => (HI.find((x) => x[0] === k) || [0, T('안녕!', 'Hi!')])[1];
  function sendMove() {
    const t = G.clk ? G.clk.t.map((x) => Math.max(0, Math.round(x))) : [0, 0];
    Cloud.update('games/' + cfg.gid, { moves: G.moves.slice(), t, drawOffer: -1, updatedAt: Date.now() }).catch(() => { toast(T('연결이 불안정해요. 잠시 후 다시 맞춰 볼게요.', 'Connection is unstable. Re-syncing soon.')); });
  }
  function resync(d) {
    replay(d.moves || []);
    if (G.clk && d.t) { G.clk.t = d.t.slice(); G.clk.run = G.moves.length >= 1 && d.status === 'active' ? G.g.turn : -1; G.clk.last = Date.now(); }
    syncBoard(); renderMoves(); renderBars(); turnMsg(); updateBadges();
  }
  async function promptDraw() {
    G.asking = true;
    const k = await ask({ lion: 'think', title: T('무승부 제안', 'Draw offer'), text: T('친구가 무승부를 제안했어요. 받을까요?', 'Your friend offers a draw. Accept?'), buttons: [{ k: 'y', label: T('받을게요', 'Accept'), cls: 'mint' }, { k: 'n', label: T('아니요', 'Decline'), cls: 'ghost' }] });
    G.asking = false;
    if (G.over || G.dead) return;
    if (k === 'y') finish({ winner: -1, reason: 'agree' });
    else Cloud.update('games/' + cfg.gid, { drawOffer: -1, updatedAt: Date.now() }).catch(() => {});
  }
  function showHi(h) {
    const who = h.by === 0 ? NG.white.nick : NG.black.nick;
    setMsg(h.by, `<b>${esc(who)}</b>: ${rich(hiText(h.k))}`, 'cheer');
    sfx('good'); clearTimeout(G.hiT); G.hiT = setTimeout(() => { if (!G.dead && !G.over) turnMsg(); }, 5000);
  }
  async function doHi() {
    if (Date.now() - (G.lastHi || 0) < 2500) return;
    const k = await ask({ lion: 'wink', title: T('인사 보내기', 'Send a greeting'), html: `<div class="chips" style="justify-content:center">${HI.map((x) => `<button class="chip" data-hk="${x[0]}">${tx(x[1])}</button>`).join('')}</div>`, buttons: [{ k: 'x', label: T('닫기', 'Close'), cls: 'ghost' }] }).catch(() => 'x');
    void k;
  }
  const onHk = (e) => {
    const b = e.target.closest('[data-hk]'); if (!b || G.dead) return;
    const ov = b.closest('.overlay'); if (ov) ov.remove();
    if (Date.now() - (G.lastHi || 0) < 2500) return;
    G.lastHi = Date.now();
    const n = ((G.doc && G.doc.hi && G.doc.hi.n) || 0) + 1;
    Cloud.update('games/' + cfg.gid, { hi: { n, by: cfg.me, k: b.dataset.hk }, updatedAt: Date.now() }).catch(() => {});
    G.hiN = n; showHi({ by: cfg.me, k: b.dataset.hk });
  };
  Layer.addEventListener('click', onHk);
  function onGame(d) {
    if (!d || G.dead) return;
    G.doc = d;
    const n = G.moves.length, dm = d.moves || [];
    let ok = true; for (let i = 0; i < Math.min(n, dm.length); i++) if (G.moves[i] !== dm[i]) ok = false;
    if (!ok) resync(d);
    else if (dm.length > n) {
      for (let i = n; i < dm.length; i++) { const m = G.g.findUci(dm[i]); if (!m) break; applyMove(m, true); }
      if (G.clk && d.t && !G.over) { G.clk.t = d.t.slice(); G.clk.last = Date.now(); }
    } else if (dm.length < n) {
      clearTimeout(G.rb); G.rb = setTimeout(() => { if (G.doc && G.doc.moves.length < G.moves.length) resync(G.doc); }, 2500);
    }
    if (d.status === 'active' && G.clk && G.clk.run < 0 && G.moves.length >= 1) { G.clk.run = G.g.turn; G.clk.last = Date.now(); }
    if (d.status === 'over' && !G.over) finish(d.result || { winner: -1, reason: 'agree' }, true);
    if (d.drawOffer === (cfg.me ^ 1) && !G.asking && !G.over) promptDraw();
    if (d.hi && d.hi.n > (G.hiN || 0)) { G.hiN = d.hi.n; if (d.hi.by !== cfg.me) showHi(d.hi); }
    if (!G.over && d.status === 'active') updateBadges();
  }

  /* ---------- events ---------- */
  root.addEventListener('click', (e) => {
    const b = e.target.closest('button[data-a]'); if (!b) return;
    sfx('tap');
    const a = b.dataset.a, c = b.dataset.c;
    if (a === 'hint') doHint(c);
    else if (a === 'danger') doDanger(c);
    else if (a === 'undo') doUndo();
    else if (a === 'flip') doFlip();
    else if (a === 'menu') openMenu(c);
    else if (a === 'hi') doHi();
  });

  /* ---------- start ---------- */
  if (params.resume || NG) replay(startMoves); else { G.g = new Chess(START); G.g.track = true; }
  renderDocks(); renderBars(); renderMoves(); syncBoard();
  if (NG) {
    G.doc = NG; G.hiN = (NG.hi && NG.hi.n) || 0;
    if (G.clk) { G.clk.run = G.moves.length >= 1 && NG.status === 'active' ? G.g.turn : -1; G.clk.last = Date.now(); }
    renderBars(); turnMsg();
    if (NG.status === 'over') finish(NG.result || { winner: -1, reason: 'agree' }, true);
    else unsubGame = Cloud.watch('games/' + cfg.gid, onGame);
  } else if (params.resume && G.moves.length) {
    G.paused = true; G.pauseBy = 'resume'; bw.classList.add('hide');
    turnMsg();
    ask({ lion: 'happy', title: T('이어서 할까요?', 'Continue the game?'), buttons: [{ k: 'go', label: T('이어하기', 'Continue'), cls: 'mint' }] }).then(() => {
      resume('resume');
      if (G.clk) G.clk.run = G.moves.length >= 1 ? G.g.turn : -1;
      if (cfg.mode === 'cpu' && G.g.turn !== cfg.me) aiTurn();
    });
  } else {
    if (cfg.mode === 'cpu') {
      setMsg(0, cfg.me === 0 ? T('흰색이 먼저 둬요. 내 차례예요! \'잘 부탁드립니다\'', 'White moves first, and that is you! Say \'good luck\'.') : T('레오가 흰색이에요. 레오가 먼저 둬요.', 'Leo plays White and moves first.'), 'cheer');
      if (cfg.me === 1) setTimeout(() => { if (!G.dead && !G.over) aiTurn(); }, 700);
    } else turnMsg();
  }
  touchStreak();
};

</script>
<script>
/* Boot */
'use strict';
(function () {
  document.body.insertAdjacentHTML('afterbegin', Art.sprite());
  applyPrefs();
  addEventListener('pagehide', saveNow);
  setInterval(lockTick, 1000);
  if (Lock.active() && Lock.remaining() <= 0) showLock();
  go('home');
  if (typeof Net !== 'undefined') Net.start();
})();

</script>
<script>if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});</script></body></html>
